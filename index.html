<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Commission Performance Dashboard — April 2026</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0/dist/chartjs-plugin-datalabels.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap');

:root {
  --navy:#2A0A3D; --orchid:#A74DCE; --lilac:#C09BEC; --lilac-tint:#F4EEFC;
  --mid:#47265E; --silver:#E6E9EF; --white:#FFFFFF;
  --text:#1A0A28; --muted:#7B6B8A; --border:#D8CDE8; --bg:#F8F5FC;
  --up:#196B24; --up-bg:#D5F5E3; --down:#C0392B; --down-bg:#FADBD8;
  --same:#1A5276; --same-bg:#EBF5FB;
  --su-c:#922B21; --su-bg:#FADBD8; --mu-c:#935116; --mu-bg:#FDEBD0;
  --ot-c:#7D6608; --ot-bg:#FEF9E7; --me-c:#1D6A39; --me-bg:#EAFAF1;
  --ee-c:#196B24; --ee-bg:#D5F5E3; --so-c:#0B5345; --so-bg:#A9DFBF;
  --radius:10px; --radius-lg:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"DM Sans",sans-serif;background:var(--bg);color:var(--text);min-height:100vh}

.app-header{background:var(--navy);padding:16px 28px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.app-header h1{font-size:16px;font-weight:500;color:#fff;letter-spacing:.01em}
.app-header .period{font-family:"DM Mono",monospace;font-size:11px;color:var(--lilac);background:rgba(192,155,236,.15);padding:4px 10px;border-radius:6px;border:1px solid rgba(192,155,236,.3)}

/* ── GLOBAL FILTER BAR ── */
.filter-bar{background:var(--white);border-bottom:1px solid var(--border);padding:10px 28px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.filter-bar label{font-size:11px;font-weight:500;color:var(--muted);white-space:nowrap}
.filter-bar select,.filter-bar .multi-select-wrap{font-family:"DM Sans",sans-serif;font-size:12px;padding:6px 10px;border-radius:var(--radius);border:1px solid var(--border);background:var(--white);color:var(--text);cursor:pointer;min-width:130px}
.filter-bar select:focus{outline:none;border-color:var(--orchid)}
.filter-sep{width:1px;height:24px;background:var(--border);margin:0 4px;flex-shrink:0}
.filter-clear{font-family:"DM Sans",sans-serif;font-size:11px;padding:5px 12px;border-radius:var(--radius);border:1px solid var(--border);background:var(--white);color:var(--muted);cursor:pointer;white-space:nowrap}
.filter-clear:hover{border-color:var(--orchid);color:var(--orchid)}

/* ── MULTI-SELECT DROPDOWN ── */
.multi-wrap{position:relative;display:inline-block}
.multi-btn{font-family:"DM Sans",sans-serif;font-size:12px;padding:6px 28px 6px 10px;border-radius:var(--radius);border:1px solid var(--border);background:var(--white);color:var(--text);cursor:pointer;min-width:130px;text-align:left;position:relative;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.multi-btn::after{content:"▾";position:absolute;right:8px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:10px}
.multi-btn:focus{outline:none;border-color:var(--orchid)}
.multi-dropdown{display:none;position:absolute;top:calc(100% + 4px);left:0;z-index:100;background:var(--white);border:1px solid var(--border);border-radius:var(--radius);box-shadow:0 4px 16px rgba(42,10,61,.12);min-width:160px;max-height:220px;overflow-y:auto}
.multi-dropdown.open{display:block}
.multi-option{display:flex;align-items:center;gap:8px;padding:7px 12px;font-size:12px;cursor:pointer;color:var(--text)}
.multi-option:hover{background:var(--lilac-tint)}
.multi-option input[type=checkbox]{accent-color:var(--orchid);cursor:pointer}

.main{padding:20px 28px;max-width:1400px;margin:0 auto}
.kpi-row{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px}
.kpi-card{background:var(--white);border:1px solid var(--border);border-radius:var(--radius-lg);padding:14px 18px;position:relative;overflow:hidden}
.kpi-card::before{content:"";position:absolute;top:0;left:0;width:4px;height:100%;background:var(--orchid);border-radius:2px 0 0 2px}
.kpi-label{font-size:11px;color:var(--muted);margin-bottom:5px;text-transform:uppercase;letter-spacing:.06em}
.kpi-val{font-size:26px;font-weight:600;color:var(--navy);line-height:1;margin-bottom:4px}
.kpi-sub{font-size:11px;color:var(--muted)}
.kpi-sub.pos{color:var(--up)}.kpi-sub.neg{color:var(--down)}

.tab-bar{display:flex;border-bottom:1px solid var(--border);background:var(--white);border-radius:var(--radius-lg) var(--radius-lg) 0 0;padding:0 4px}
.tab-btn{padding:11px 18px;font-size:13px;font-weight:500;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;background:none;border-top:none;border-left:none;border-right:none;transition:all .15s;white-space:nowrap}
.tab-btn:hover{color:var(--orchid)}
.tab-btn.active{color:var(--orchid);border-bottom-color:var(--orchid)}

.panel{display:none}.panel.active{display:block}
.chart-card{background:var(--white);border:1px solid var(--border);border-radius:0 0 var(--radius-lg) var(--radius-lg);padding:18px 22px}
.chart-legend{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.leg-item{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--muted)}
.leg-dot{width:10px;height:10px;border-radius:2px;flex-shrink:0}
.chart-wrap{position:relative;width:100%;height:320px}

.tier-strip{display:flex;gap:3px;margin-bottom:12px;font-size:10px;font-family:"DM Mono",monospace}
.tier-block{flex:1;border-radius:6px;padding:5px 3px;text-align:center;line-height:1.4}
.tier-block .tr{font-weight:600}.tier-block .tl{opacity:.85}

.move-layout{display:grid;grid-template-columns:220px 1fr;gap:20px;margin-top:4px}
.move-summary{display:flex;flex-direction:column;gap:8px}
.move-period-row{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.move-period-row label{font-size:12px;color:var(--muted)}
.move-period-row select{font-family:"DM Sans",sans-serif;font-size:12px;padding:5px 10px;border-radius:var(--radius);border:1px solid var(--border);background:var(--white);color:var(--text)}
.move-stat-card{border-radius:var(--radius);padding:12px 16px}
.move-stat-card .msn{font-size:26px;font-weight:600}
.move-stat-card .msl{font-size:11px;font-weight:500;margin-top:2px}
.ms-up{background:var(--up-bg);color:var(--up)}
.ms-down{background:var(--down-bg);color:var(--down)}
.ms-same{background:var(--same-bg);color:var(--same)}
.move-transitions{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.trans-section h4{font-size:12px;font-weight:600;margin-bottom:8px}
.trans-section.up h4{color:var(--up)}.trans-section.dn h4{color:var(--down)}
.trans-row{display:flex;align-items:center;justify-content:space-between;padding:6px 10px;border-radius:6px;font-size:12px;background:var(--bg);margin-bottom:4px}
.trans-row .tn{font-weight:600;min-width:24px;text-align:right}
.tn-up{color:var(--up)}.tn-dn{color:var(--down)}

.table-wrap{border:1px solid var(--border);border-radius:var(--radius-lg);overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12px;min-width:640px}
thead th{background:var(--navy);color:#fff;padding:8px 11px;text-align:left;font-weight:500;font-size:11px;white-space:nowrap;text-transform:uppercase;letter-spacing:.05em}
thead th:first-child{border-radius:var(--radius-lg) 0 0 0}
thead th:last-child{border-radius:0 var(--radius-lg) 0 0}
tbody td{padding:6px 11px;border-bottom:1px solid var(--silver);vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
tbody tr:nth-child(even) td{background:var(--bg)}
tbody tr:hover td{background:var(--lilac-tint)}
.badge{display:inline-block;padding:2px 7px;border-radius:10px;font-size:10px;font-weight:600;white-space:nowrap;font-family:"DM Mono",monospace}
.b-SU{background:var(--su-bg);color:var(--su-c)}.b-MU{background:var(--mu-bg);color:var(--mu-c)}
.b-OT{background:var(--ot-bg);color:var(--ot-c)}.b-ME{background:var(--me-bg);color:var(--me-c)}
.b-EE{background:var(--ee-bg);color:var(--ee-c)}.b-SO{background:var(--so-bg);color:var(--so-c)}
.arr-up{color:var(--up);font-weight:700;font-size:13px}
.arr-down{color:var(--down);font-weight:700;font-size:13px}
.arr-same{color:var(--same);font-weight:700;font-size:13px}
.arr-null{color:var(--muted);font-size:11px}
.pagination{display:flex;align-items:center;justify-content:space-between;margin-top:10px;font-size:12px;color:var(--muted)}
.pagination button{font-family:"DM Sans",sans-serif;font-size:11px;padding:5px 12px;border-radius:var(--radius);border:1px solid var(--border);background:var(--white);color:var(--text);cursor:pointer}
.pagination button:hover:not(:disabled){background:var(--lilac-tint);border-color:var(--orchid)}
.pagination button:disabled{opacity:.4;cursor:default}
.empty{text-align:center;padding:36px;color:var(--muted);font-size:13px}
</style>
</head>
<body>

<header class="app-header">
  <h1>Sales Commission Performance Dashboard</h1>
  <span class="period">Through April 2026</span>
</header>

<!-- GLOBAL FILTER BAR -->
<div class="filter-bar">
  <label>Channel</label>
  <select id="f-channel">
    <option value="All">All channels</option>
    <option value="Field">Field</option>
    <option value="Inside">Inside</option>
    <option value="Majors">Majors</option>
  </select>

  <div class="filter-sep"></div>

  <label>Director</label>
  <select id="f-director"><option value="">All directors</option></select>

  <label>RSM</label>
  <select id="f-rsm"><option value="">All RSMs</option></select>

  <label>Rep</label>
  <select id="f-rep"><option value="">All reps</option></select>

  <div id="month-filter-group" style="display:flex;align-items:center;gap:8px">
    <div class="filter-sep"></div>
    <label>Months</label>
    <div class="multi-wrap" id="month-wrap">
      <button class="multi-btn" id="month-btn" type="button">Feb, Mar, Apr</button>
      <div class="multi-dropdown" id="month-dropdown">
        <label class="multi-option"><input type="checkbox" value="Jan"> Jan 26</label>
        <label class="multi-option"><input type="checkbox" value="Feb" checked> Feb 26</label>
        <label class="multi-option"><input type="checkbox" value="Mar" checked> Mar 26</label>
        <label class="multi-option"><input type="checkbox" value="Apr" checked> Apr 26</label>
      </div>
    </div>
  </div>

  <label>Bucket</label>
  <select id="f-bucket">
    <option value="">All buckets</option>
    <option value="Significant Underperformance">Sig. underperformance</option>
    <option value="Minor Underperformance">Minor underperformance</option>
    <option value="On Target">On target</option>
    <option value="Meeting Expectations">Meeting expectations</option>
    <option value="Exceeding Expectations">Exceeding expectations</option>
    <option value="Significant Overperformance">Sig. overperformance</option>
  </select>

  <label>Movement</label>
  <select id="f-move">
    <option value="">All movements</option>
    <option value="up">▲ Moved up</option>
    <option value="down">▼ Moved down</option>
    <option value="same">→ No change</option>
  </select>

  <button class="filter-clear" onclick="clearAllFilters()">Clear all</button>
</div>

<main class="main">
  <div class="kpi-row" id="kpi-row"></div>

  <div class="tab-bar">
    <button class="tab-btn active" data-tab="pace">Attainment to pace</button>
    <button class="tab-btn" data-tab="payout">Payout buckets</button>
    <button class="tab-btn" data-tab="movement">MoM movement</button>
    <button class="tab-btn" data-tab="reps">Rep detail</button>
  </div>

  <div class="panel active chart-card" id="panel-pace">
    <div class="tier-strip" id="tier-strip"></div>
    <div class="chart-legend" id="pace-legend"></div>
    <div class="chart-wrap"><canvas id="pace-chart" role="img" aria-label="Grouped bar chart of attainment to pace bucket counts by month"></canvas></div>
  </div>

  <div class="panel chart-card" id="panel-payout">
    <div class="chart-legend" id="payout-legend"></div>
    <div class="chart-wrap"><canvas id="payout-chart" role="img" aria-label="Grouped bar chart of payout bucket counts by month"></canvas></div>
  </div>

  <div class="panel chart-card" id="panel-movement">
    <div class="move-period-row">
      <label>Period:</label>
      <select id="move-period"></select>
    </div>
    <div class="move-layout">
      <div class="move-summary" id="move-summary"></div>
      <div class="move-transitions" id="move-transitions"></div>
    </div>
  </div>

  <div class="panel chart-card" id="panel-reps">
    <div class="table-wrap" id="rep-table-wrap"></div>
    <div class="pagination" id="pagination"></div>
  </div>
</main>

function getRepPool() {

}

function populateCascade() {
  const pool = getRepPool();

  const dirs = [...new Set(pool.map(r => r.director))].filter(Boolean).sort();
  const dSel = document.getElementById("f-director");
  dSel.innerHTML = `<option value="">All directors</option>` + dirs.map(d => `<option value="${d}"${d===F.director?" selected":""}>${d}</option>`).join("");
  if (!dirs.includes(F.director)) F.director = "";

  const rsmPool = F.director ? pool.filter(r => r.director === F.director) : pool;
  const rsms = [...new Set(rsmPool.map(r => r.rsm))].filter(Boolean).sort();
  const rSel = document.getElementById("f-rsm");
  rSel.innerHTML = `<option value="">All RSMs</option>` + rsms.map(r => `<option value="${r}"${r===F.rsm?" selected":""}>${r}</option>`).join("");
  if (!rsms.includes(F.rsm)) F.rsm = "";

  const namePool = rsmPool.filter(r => !F.rsm || r.rsm === F.rsm);
  const names = [...new Set(namePool.map(r => r.name))].filter(Boolean).sort();
  const nSel = document.getElementById("f-rep");
  nSel.innerHTML = `<option value="">All reps</option>` + names.map(n => `<option value="${n}"${n===F.rep?" selected":""}>${n}</option>`).join("");
  if (!names.includes(F.rep)) F.rep = "";
}

// ── COMPUTED BUCKET COUNTS (respects all filters) ─────────────────────────────
function computePaceBuckets() {
  // If no granular filters, use fast pre-aggregated channel data
  if (!F.director && !F.rsm && !F.rep) {
    const src = DATA.bucketsByMonth[F.channel];
    return F.months.map(m => ({
      month: m,
      counts: PACE_KEYS.map(k => (src[m] && src[m][k]) || 0)
    }));
  }
  // Granular filters active — count from rep table
  let pool = getRepPool();
  if (F.director) pool = pool.filter(r => r.director === F.director);
  if (F.rsm)      pool = pool.filter(r => r.rsm === F.rsm);
  if (F.rep)      pool = pool.filter(r => r.name === F.rep);

  return F.months.map(m => ({
    month: m,
    counts: PACE_KEYS.map(k => {
      const fullName = Object.keys(PACE_FULL).find(n => PACE_FULL[n] === k);
      return pool.filter(r => r.months[m] && r.months[m].bucket === fullName).length;
    })
  }));
}

function computePayoutBuckets() {
  // If no granular filters, use fast pre-aggregated channel data
  if (!F.director && !F.rsm && !F.rep) {
    const src = DATA.payoutByMonth[F.channel];
    return F.months.filter(m => src[m]).map(m => ({
      month: m,
      counts: PAYOUT_ORDER.map(b => (src[m][b]) || 0)
    }));
  }
  // Granular filters active — count from rep table
  let pool = getRepPool();
  if (F.director) pool = pool.filter(r => r.director === F.director);
  if (F.rsm)      pool = pool.filter(r => r.rsm === F.rsm);
  if (F.rep)      pool = pool.filter(r => r.name === F.rep);

  return F.months.map(m => ({
    month: m,
    counts: PAYOUT_ORDER.map(b =>
      pool.filter(r => r.months[m] && r.months[m].payout === b).length
    )
  }));
}

// ── MOVEMENT ──────────────────────────────────────────────────────────────────
const PACE_ORDER_FULL = ["Significant Underperformance","Minor Underperformance","On Target","Meeting Expectations","Exceeding Expectations","Significant Overperformance"];
const PACE_RANK_MAP = Object.fromEntries(PACE_ORDER_FULL.map((b,i) => [b,i]));

function computeMovements() {
  // Get the reps matching all active filters (excluding bucket/move which are latest-month only)
  let reps = getRepPool();
  if (F.director) reps = reps.filter(r => r.director === F.director);
  if (F.rsm)      reps = reps.filter(r => r.rsm === F.rsm);
  if (F.rep)      reps = reps.filter(r => r.name === F.rep);

  // Build consecutive month pairs from the selected months
  const allMonths = ["Jan","Feb","Mar","Apr"];
  const selMonths = F.months.slice().sort((a,b) => allMonths.indexOf(a) - allMonths.indexOf(b));
  const pairs = [];
  for (let i = 1; i < allMonths.length; i++) {
    const from = allMonths[i-1], to = allMonths[i];
    if (selMonths.includes(from) && selMonths.includes(to)) {
      pairs.push({from, to});
    }
  }
  // If only one month selected, show the transition into it from the prior month
  if (pairs.length === 0 && selMonths.length === 1) {
    const idx = allMonths.indexOf(selMonths[0]);
    if (idx > 0) pairs.push({from: allMonths[idx-1], to: selMonths[0]});
  }

  return pairs.map(({from, to}) => {
    const upTrans = {}, downTrans = {};
    let nUp = 0, nDown = 0, nSame = 0;

    reps.forEach(r => {
      const mFrom = r.months[from], mTo = r.months[to];
      if (!mFrom?.bucket || !mTo?.bucket) return;
      const rFrom = PACE_RANK_MAP[mFrom.bucket] ?? -1;
      const rTo   = PACE_RANK_MAP[mTo.bucket]   ?? -1;
      if (rFrom < 0 || rTo < 0) return;
      const key = `${mFrom.bucket}|||${mTo.bucket}`;
      if (rTo > rFrom)       { nUp++;   upTrans[key]   = (upTrans[key]   || 0) + 1; }
      else if (rTo < rFrom)  { nDown++; downTrans[key] = (downTrans[key] || 0) + 1; }
      else                   { nSame++; }
    });

    const sortedUp   = Object.entries(upTrans)  .sort((a,b) => b[1]-a[1]).slice(0,5)
      .map(([k,n]) => { const [f,t] = k.split("|||"); return {from:f, to:t, n}; });
    const sortedDown = Object.entries(downTrans) .sort((a,b) => b[1]-a[1]).slice(0,5)
      .map(([k,n]) => { const [f,t] = k.split("|||"); return {from:f, to:t, n}; });

    return { from, to, nUp, nDown, nSame, topUp: sortedUp, topDown: sortedDown };
  });
}

function renderMovement() {
  const moves = computeMovements();
  const sel = document.getElementById("move-period");

  if (!moves.length) {
    sel.innerHTML = '<option>No consecutive months selected</option>';
    document.getElementById("move-summary").innerHTML = '';
    document.getElementById("move-transitions").innerHTML =
      '<div style="color:var(--muted);font-size:12px;padding:12px 0">Select at least two consecutive months to see movement data.</div>';
    return;
  }

  sel.innerHTML = moves.map((m,i) => `<option value="${i}">${m.from} → ${m.to}</option>`).join("");
  // Default to the most recent period (last in list)
  const idx = activePeriodIdx === Infinity ? moves.length - 1 : Math.min(activePeriodIdx, moves.length - 1);
  activePeriodIdx = idx;
  sel.value = idx;
  sel.onchange = e => { activePeriodIdx = +e.target.value; updateMovement(moves); };
  updateMovement(moves);
}

function updateMovement(moves) {
  if (!moves || !moves.length) return;
  const m = moves[Math.min(activePeriodIdx, moves.length - 1)];
  document.getElementById("move-summary").innerHTML = `
    <div class="move-stat-card ms-up"><div class="msn">${m.nUp}</div><div class="msl">▲ Improved</div></div>
    <div class="move-stat-card ms-down"><div class="msn">${m.nDown}</div><div class="msl">▼ Declined</div></div>
    <div class="move-stat-card ms-same"><div class="msn">${m.nSame}</div><div class="msl">→ No change</div></div>`;
  const upHtml   = m.topUp.map(t =>
    `<div class="trans-row"><span>${bShort(t.from)} → ${bShort(t.to)}</span><span class="tn tn-up">${t.n}</span></div>`
  ).join("") || '<div class="trans-row"><span style="color:#7B6B8A">None this period</span></div>';
  const downHtml = m.topDown.map(t =>
    `<div class="trans-row"><span>${bShort(t.from)} → ${bShort(t.to)}</span><span class="tn tn-dn">${t.n}</span></div>`
  ).join("") || '<div class="trans-row"><span style="color:#7B6B8A">None this period</span></div>';
  document.getElementById("move-transitions").innerHTML = `
    <div class="trans-section up"><h4>▲ Moved up — tier transitions</h4>${upHtml}</div>
    <div class="trans-section dn"><h4>▼ Moved down — tier transitions</h4>${downHtml}</div>`;
}

// ── REP TABLE ─────────────────────────────────────────────────────────────────
function getFilteredReps() {
  let reps = getRepPool();
  if (F.director)    reps = reps.filter(r => r.director === F.director);
  if (F.rsm)         reps = reps.filter(r => r.rsm === F.rsm);
  if (F.rep)         reps = reps.filter(r => r.name === F.rep);
  const latestM = F.months[F.months.length - 1];
  if (F.bucket)      reps = reps.filter(r => { const a = r.months[latestM]; return a && a.bucket === F.bucket; });
  if (F.move)        reps = reps.filter(r => { const a = r.months[latestM]; return a && a.move === F.move; });
  return reps;
}
function moveArrow(move) {
  if (move==="up")   return '<span class="arr-up">▲</span>';
  if (move==="down") return '<span class="arr-down">▼</span>';
  if (move==="same") return '<span class="arr-same">→</span>';
  return '<span class="arr-null">—</span>';
}
function renderRepTable() {
  const filtered = getFilteredReps();
  const total = filtered.length, pages = Math.ceil(total / repPageSize);
  if (repPage >= pages) repPage = Math.max(0, pages - 1);
  const slice = filtered.slice(repPage * repPageSize, (repPage + 1) * repPageSize);
  const dispMonths = F.months.filter(m => m !== "Jan");
  const headers = dispMonths.map(m => `<th>${m} bucket</th><th>${m} var</th><th>move</th>`).join("");
  const rows = slice.map(r => {
    const cells = dispMonths.map(m => {
      const md = r.months[m];
      if (!md || !md.bucket) return `<td style="color:#B0A0C0;font-size:11px">—</td><td>—</td><td><span class="arr-null">—</span></td>`;
      const bk = bKey(md.bucket), bc = bk ? BADGE_MAP[bk] : "";
      const vs = md.var !== null ? `<span style="color:${md.var>=0?"#196B24":"#C0392B"};font-family:'DM Mono',monospace;font-size:11px">${md.var>=0?"+":""}${md.var.toFixed(2)}%</span>` : "—";
      return `<td><span class="badge ${bc}">${bk?PACE_LABELS[bk]:md.bucket}</span></td><td>${vs}</td><td>${moveArrow(md.move)}</td>`;
    }).join("");
    return `<tr><td><strong>${r.name}</strong></td><td style="color:#7B6B8A;font-size:11px">${r.director}</td><td style="color:#7B6B8A;font-size:11px">${r.rsm}</td>${cells}</tr>`;
  }).join("");
  document.getElementById("rep-table-wrap").innerHTML = `
    <table>
      <thead><tr><th>Name</th><th>Director</th><th>RSM</th>${headers}</tr></thead>
      <tbody>${rows || `<tr><td colspan="15" class="empty">No reps match the current filters</td></tr>`}</tbody>
    </table>`;
  document.getElementById("pagination").innerHTML = `
    <span>${total} rep${total!==1?"s":""} &nbsp;·&nbsp; page ${repPage+1} of ${pages||1}</span>
    <div style="display:flex;gap:6px">
      <button onclick="repPage=Math.max(0,repPage-1);renderRepTable()" ${repPage===0?"disabled":""}>← Prev</button>
      <button onclick="repPage=Math.min(Math.ceil(getFilteredReps().length/${repPageSize})-1,repPage+1);renderRepTable()" ${repPage>=pages-1?"disabled":""}>Next →</button>
    </div>`;
}

// ── REFRESH ALL ───────────────────────────────────────────────────────────────
function refreshAll() {
  renderKpi();
  populateCascade();
  if (activeTab === "pace")     renderPaceChart();
  if (activeTab === "payout")   renderPayoutChart();
  if (activeTab === "movement") renderMovement();
  if (activeTab === "reps")     renderRepTable();
}

// ── TAB SWITCHING ─────────────────────────────────────────────────────────────
function switchTab(tab) {
  activeTab = tab;
  document.querySelectorAll(".tab-btn").forEach(t => t.classList.toggle("active", t.dataset.tab === tab));
  document.querySelectorAll(".panel").forEach(p => p.classList.toggle("active", p.id === "panel-" + tab));
  // Hide months filter on movement tab — period selector inside the tab handles it
  document.getElementById("month-filter-group").style.display = tab === "movement" ? "none" : "flex";
  if (tab === "pace")     renderPaceChart();
  if (tab === "payout")   renderPayoutChart();
  if (tab === "movement") { activePeriodIdx = Infinity; renderMovement(); }
  if (tab === "reps")     renderRepTable();
}

function clearAllFilters() {
  F.channel = "All"; F.director = ""; F.rsm = ""; F.rep = "";
  F.months = ["Feb","Mar","Apr"]; F.bucket = ""; F.move = "";
  document.getElementById("f-channel").value = "All";
  document.getElementById("f-bucket").value = "";
  document.getElementById("f-move").value = "";
  monthDropdown.querySelectorAll("input").forEach(cb => { cb.checked = ["Feb","Mar","Apr"].includes(cb.value); });
  monthBtn.textContent = "Feb 26, Mar 26, Apr 26";
  repPage = 0;
  refreshAll();
}

// ── EVENTS ────────────────────────────────────────────────────────────────────
document.querySelectorAll(".tab-btn").forEach(t => t.addEventListener("click", () => switchTab(t.dataset.tab)));

document.getElementById("f-channel").addEventListener("change", e => {
  F.channel = e.target.value; F.director = ""; F.rsm = ""; F.rep = ""; repPage = 0; refreshAll();
});
document.getElementById("f-director").addEventListener("change", e => {
  F.director = e.target.value; F.rsm = ""; F.rep = ""; repPage = 0; refreshAll();
});
document.getElementById("f-rsm").addEventListener("change", e => {
  F.rsm = e.target.value; F.rep = ""; repPage = 0; refreshAll();
});
document.getElementById("f-rep").addEventListener("change", e => {
  F.rep = e.target.value; repPage = 0; refreshAll();
});
document.getElementById("f-bucket").addEventListener("change", e => {
  F.bucket = e.target.value; repPage = 0; refreshAll();
});
document.getElementById("f-move").addEventListener("change", e => {
  F.move = e.target.value; repPage = 0; refreshAll();
});

// ── INIT ──────────────────────────────────────────────────────────────────────
renderTierStrip();
populateCascade();
renderKpi();
renderPaceChart();
</script>
</body>
</html>
